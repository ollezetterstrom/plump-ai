[package]
name = "plump-engine"
version = "0.1.0"
edition = "2021"
description = "Rust bitboard engine for the Swedish card game Plump"
license = "MIT"

[lib]
name = "plump_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
rayon = "1.10"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
